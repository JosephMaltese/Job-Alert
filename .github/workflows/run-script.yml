name: run-job-script
permissions:
    contents: write
concurrency:
  group: internship-monitor
  cancel-in-progress: false
on:
    workflow_dispatch:
jobs:
    check-jobs:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout master
              uses: actions/checkout@v6
            # Checkout state branch into separate directory
            - name: Checkout db
              uses: actions/checkout@v6
              with:
                ref: state
                path: state
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Fetch State Branch db
              run: cp state/jobs.db jobs.db
            - name: Run Main Script
              env:
                EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
                EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
                RECIPIENT_EMAIL_ADDRESS: ${{ secrets.RECIPIENT_EMAIL_ADDRESS }}
              run: python main.py
            - name: Copy potentially modified db back to state
              run: cp jobs.db state/jobs.db
            - name: Commit only if jobs.db has changes
              working-directory: state
              run: |
                git config user.name "internship-monitor"
                git config user.email "internship-monitor@users.noreply.github.com"

                git add jobs.db

                if git diff --cached --quiet; then
                    echo "Database unchanged."
                else
                    git commit -m "Updated internship database"
                    git push
                fi